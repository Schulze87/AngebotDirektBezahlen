name: Build Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # manuell auslösbar

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug – Struktur prüfen
        run: |
          echo "=== Repo-Root ==="
          ls -la
          echo "=== Plugin-Verzeichnis ==="
          ls -la ./LukasQuantityRule
          echo "=== composer.json (Plugin) ==="
          cat ./LukasQuantityRule/composer.json
          echo "=== src/ (Auszug) ==="
          find ./LukasQuantityRule/src -maxdepth 3 -type f | head -n 200

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, iconv, json, mbstring, openssl, pdo, tokenizer, xml, zip
          coverage: none

      - name: Install shopware-cli
        uses: shopware/shopware-cli-action@v1
        with:
          version: 0.12.0

      - name: Build Extension ZIP
        run: |
          shopware-cli extension zip ./LukasQuantityRule \
            --disable-git \
            --output-directory ./dist \
            --verbose

      - name: Upload ZIP as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LukasQuantityRule
          path: ./dist/*.zip
          retention-days: 30
