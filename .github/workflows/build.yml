name: Build Plugin

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug – Struktur prüfen
        run: |
          echo "=== Inhalt Repo-Root ==="
          ls -la
          echo "=== Inhalt von LukasQuantityRule/ ==="
          ls -la ./LukasQuantityRule
          echo "=== composer.json (Plugin) ==="
          cat ./LukasQuantityRule/composer.json
          echo "=== src/ (Auszug) ==="
          find ./LukasQuantityRule/src -maxdepth 3 -type f | head -n 200
          echo "=== Plugin-Klasse (falls vorhanden) ==="
          find ./LukasQuantityRule/src -maxdepth 2 -type f -name "*.php" -print

      - name: Install shopware-cli
        uses: shopware/shopware-cli-action@v1
        with:
          version: 0.12.0

      - name: Build Extension
        run: shopware-cli extension zip ./LukasQuantityRule --disable-git --verbose

      - name: Validate ZIP (optional)
        run: shopware-cli extension validate *.zip

      - name: Upload ZIP as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LukasQuantityRule
          path: "*.zip"
